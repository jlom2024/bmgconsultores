# nginx.conf — Reverse proxy para BG Travel en VPS Hostinger
# Ubicación: /etc/nginx/sites-available/bg-travel
# Activar: ln -sf /etc/nginx/sites-available/bg-travel /etc/nginx/sites-enabled/bg-travel

# Redirigir HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bgtravel.pe www.bgtravel.pe;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bgtravel.pe www.bgtravel.pe;

    # --- TLS (gestionar con certbot) ---
    ssl_certificate     /etc/letsencrypt/live/bgtravel.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bgtravel.pe/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- Seguridad ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # CSP se inyecta desde la app Node; no duplicar aquí para evitar conflicto

    # --- Compresión ---
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml
        font/woff2 font/woff;

    # --- Límites de tamaño ---
    client_max_body_size 10M;

    # --- Rate limiting --- 
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Assets estáticos con hash — cacheable indefinidamente
    location /assets/ {
        root /var/www/bg-travel/dist-node/client;
        expires max;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
        try_files $uri =404;
    }

    # Imágenes y archivos públicos — cache moderado
    location ~* \.(png|jpg|jpeg|gif|webp|avif|ico|svg|woff2|woff)$ {
        root /var/www/bg-travel/dist-node/client;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Vary Accept-Encoding;
        access_log off;
        try_files $uri @node;
    }

    # Endpoints de login — rate limitado estrictamente
    location ~ ^/(login|login-cliente|_server/api/auth) {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Server functions (API) — rate limitado
    location /_server/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Todo lo demás — SSR Node.js
    location @node {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Bloquear acceso directo al admin desde fuera (opcional — solo IPs de confianza)
    # location /admin {
    #     allow  TU_IP;
    #     deny   all;
    #     proxy_pass http://127.0.0.1:3000;
    #     include /etc/nginx/proxy_params;
    # }
}
