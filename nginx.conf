server {
    listen 80;
    server_name localhost bmgconsultores.site www.bmgconsultores.site;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión GZIP optimizada
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cabeceras de seguridad recomendadas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache inmutable para assets versionados (JS, CSS, imágenes con hash)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Desactivar cache para index.html para asegurar que los usuarios reciban siempre la última versión
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Manejo de rutas SPA (React Router fallback a index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Errores estándar
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
